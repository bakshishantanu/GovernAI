version: '3.8'

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: governai-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: governai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d governai"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
