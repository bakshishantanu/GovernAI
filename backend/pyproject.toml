[project]
name = "governai-backend"
version = "0.1.0"
description = "GovernAI backend"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.30",
    "alembic>=1.14",
    "pydantic>=2.7",
    "langgraph>=0.2",
    "pyjwt>=2.8",
    "pydantic-settings>=2.6",
    "structlog>=24.4",
    "python-jose[cryptography]>=3.3",
    "pyjwt[crypto]>=2.9",
    "httpx>=0.27",
    "pgvector>=0.3",
    "sqlglot>=25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "pyright>=1.1",
    "python-dotenv>=1.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

# target-version must match the interpreter this project is actually run and
# tested on (3.10), not an aspirational one. It was "py312" while the venv was
# 3.10.11, so `ruff --fix` rewrote every `datetime.timezone.utc` into
# `datetime.UTC` (UP017) - a 3.11+ name - and the whole backend stopped
# importing. A lint target ahead of the runtime silently generates code that
# cannot run.
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "basic"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]